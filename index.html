<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WMB GYM">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>WMB GYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0A0A0A;font-family:'Inter',sans-serif;color:#F0F0F0;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh}
:root{--a:#00FF00;--a-dim:rgba(0,255,0,.15);--card:#161616;--card-light:#1E1E1E;--b:#252525;--m:#888;--m-light:#AAA;--bg:#0A0A0A;--text:#F0F0F0;--text-soft:#CCC}

/* ── LOADING ── */
.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg)}
.spinner{width:48px;height:48px;border:3px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--m);font-size:13px;letter-spacing:.05em}

/* ── TOAST ── */
.toast{position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card);border:1px solid;border-radius:10px;padding:12px 18px;font-size:13px;font-weight:500;z-index:9999;transition:transform .3s;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── AUTH ── */
.auth-container{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:32px}
.auth-logo{text-align:center}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:1;color:var(--a);text-shadow:0 0 32px rgba(0,255,0,.3)}
.logo-sub{font-size:12px;color:var(--m);margin-top:8px;letter-spacing:.1em;text-transform:uppercase}
.auth-card{width:100%;max-width:340px;background:var(--card);border:1px solid var(--b);border-radius:16px;padding:24px}
.auth-tabs{display:flex;gap:0;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;background:transparent;border:none;color:var(--m);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px;cursor:pointer;border-radius:8px;transition:all .2s}
.auth-tab.active{background:var(--a-dim);color:var(--a)}
.auth-form{display:flex;flex-direction:column;gap:10px}
.auth-input{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:13px 15px;-webkit-appearance:none;appearance:none;transition:border .2s}
.auth-input:focus{outline:none;border-color:var(--a)}
.auth-input::placeholder{color:var(--m)}
.auth-btn{width:100%;background:var(--a);border:none;border-radius:10px;color:#000;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:14px;cursor:pointer;margin-top:8px;transition:all .15s;letter-spacing:.02em}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-link{display:block;text-align:center;color:var(--m);font-size:12px;text-decoration:none;margin-top:14px;font-weight:500}
.auth-link:hover{color:var(--a)}

/* ── HOME ── */
.home-container{padding:env(safe-area-inset-top,28px) 16px 80px;padding-top:max(env(safe-area-inset-top),28px)}
.home-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.home-greeting{font-size:13px;color:var(--m);font-weight:500}
.home-name{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.02em;line-height:1.1;margin-top:2px}
.header-btn{background:var(--card);border:1px solid var(--b);border-radius:10px;color:var(--text);width:40px;height:40px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center}

/* Protocol badge */
.protocol-badge{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--a-dim) 0%,rgba(0,255,0,.05) 100%);border:1px solid rgba(0,255,0,.3);border-radius:14px;padding:14px 16px;margin-bottom:24px}
.pb-icon{font-size:28px}
.pb-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--a);letter-spacing:.05em;line-height:1}
.pb-meta{font-size:11px;color:var(--m-light);margin-top:3px;font-weight:500}

/* Sections */
.section{margin-bottom:24px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.05em;color:var(--text);margin-bottom:12px}

/* Workout cards */
.workout-list{display:flex;flex-direction:column;gap:10px}
.workout-card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.workout-card:active{transform:scale(.98);border-color:var(--a)}
.wc-letter{width:48px;height:48px;border-radius:12px;border:2px solid;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:24px;flex-shrink:0}
.wc-info{flex:1;min-width:0}
.wc-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em;line-height:1.1}
.wc-sub{font-size:12px;color:var(--m-light);margin-top:3px}
.wc-meta{display:flex;gap:6px;font-size:11px;color:var(--m);margin-top:6px;flex-wrap:wrap}
.wc-arrow{color:var(--m);font-size:24px;font-weight:300}

/* Coming soon */
.coming-soon{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cs-card{background:var(--card);border:1px dashed var(--b);border-radius:10px;padding:14px 12px;text-align:center;font-size:12px;color:var(--m);font-weight:500}

.empty-state{text-align:center;padding:40px 20px;color:var(--m);font-size:14px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:#000c;z-index:1000;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 18px;padding-bottom:max(36px,env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:slideup .3s}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--b);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;margin-bottom:16px}

.menu-list{display:flex;flex-direction:column;gap:4px}
.menu-item{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:14px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.menu-item:active{background:var(--card-light)}
.menu-item span{font-size:18px}

/* ── WORKOUT EXECUTION ── */
.workout-screen{min-height:100vh;display:flex;flex-direction:column;padding-bottom:120px}
.workout-header{display:flex;align-items:center;gap:12px;padding:max(env(safe-area-inset-top),20px) 16px 14px;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--bg);z-index:10}
.wh-back{background:var(--card);border:1px solid var(--b);border-radius:10px;width:40px;height:40px;color:var(--text);font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.wh-back:active{background:var(--card-light)}
.wh-title-block{flex:1;min-width:0}
.wh-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;line-height:1.1}
.wh-sub{font-size:12px;color:var(--m-light);margin-top:2px}

.workout-stats{display:flex;justify-content:space-around;padding:14px 16px 10px;border-bottom:1px solid var(--b)}
.ws-item{text-align:center}
.ws-label{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.ws-value{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--a);margin-top:2px;line-height:1}

.workout-progress-bar{height:3px;background:var(--b);overflow:hidden}
.wpb-fill{height:100%;transition:width .3s}

.workout-body{padding:16px 14px;display:flex;flex-direction:column;gap:14px}

/* Warmup section */
.warmup-section{background:var(--card);border:1px solid var(--b);border-radius:14px;overflow:hidden}
.warmup-header{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.warmup-header:active{background:var(--card-light)}
.wh-icon{font-size:24px;flex-shrink:0}
.wh-info{flex:1}
.wh-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.04em}
.wh-meta{font-size:11px;color:var(--m);margin-top:2px}
.wh-chevron{color:var(--m);font-size:14px}
.warmup-body{border-top:1px solid var(--b);padding:8px}
.warmup-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px}
.warmup-item+.warmup-item{border-top:1px solid var(--b)}
.wi-icon{font-size:18px}
.wi-info{flex:1}
.wi-name{font-size:14px;font-weight:500}
.wi-meta{font-size:11px;color:var(--m);margin-top:2px}
.warmup-skip-btn{display:block;width:100%;background:var(--bg);border:1px dashed var(--b);border-radius:8px;color:var(--m);padding:10px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;margin-top:8px}
.warmup-skip-btn:active{background:var(--card-light)}

/* Section label */
.section-label{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:10px;padding:0 4px}
.main-section{display:flex;flex-direction:column}

/* Exercise card */
.ex-card{background:var(--card);border:1px solid var(--b);border-radius:14px;overflow:hidden;transition:all .2s;margin-bottom:10px}
.ex-card.ex-done{border-color:var(--a);box-shadow:0 0 0 1px var(--a-dim)}
.ex-header{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none}
.ex-header:active{background:var(--card-light)}
.ex-progress-circle{position:relative;width:36px;height:36px;flex-shrink:0}
.ex-progress-circle svg{position:absolute;inset:0}
.ex-progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.02em;color:var(--ex-color)}
.ex-card.ex-done .ex-progress-text{color:var(--a)}
.ex-info{flex:1;min-width:0}
.ex-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.03em;line-height:1.15}
.ex-meta{display:flex;gap:5px;font-size:10px;color:var(--m);margin-top:4px;flex-wrap:wrap;align-items:center}
.ex-method-tag{background:var(--a-dim);color:var(--a);padding:2px 6px;border-radius:4px;font-weight:600;font-size:9px;letter-spacing:.05em}
.ex-chevron{color:var(--m);font-size:14px}

.ex-body{border-top:1px solid var(--b);padding:14px}
.ex-instructions{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:10px;border-left:3px solid var(--a)}
.ex-inst-label{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px}
.ex-inst-text{font-size:12px;color:var(--text-soft);line-height:1.6}
.ex-method{margin-bottom:10px}
.method-info{background:linear-gradient(135deg,var(--a-dim),rgba(0,255,0,.05));border:1px solid rgba(0,255,0,.3);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--text-soft);line-height:1.5}
.ex-previous{font-size:11px;color:var(--m);margin-bottom:10px;padding:0 4px}
.ex-previous strong{color:var(--text-soft);font-weight:600}

/* Sets table */
.sets-table{background:var(--bg);border-radius:10px;overflow:hidden}
.set-row{display:grid;grid-template-columns:30px 80px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--b)}
.set-row:last-child{border-bottom:none}
.set-row.set-header{padding:6px 10px;background:var(--card)}
.set-row.set-header > div{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.06em;font-weight:700;text-align:center}
.set-header .set-num,.set-header .set-prev{text-align:left}
.set-num{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--m);text-align:center}
.set-prev{font-size:10px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-input{width:100%;background:var(--card-light);border:1px solid var(--b);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:6px;text-align:center;-webkit-appearance:none;appearance:none}
.set-input:focus{outline:none;border-color:var(--a)}
.set-input:disabled{opacity:.5;background:var(--bg)}
.set-check{width:36px;height:32px;border:2px solid var(--b);background:transparent;border-radius:6px;color:var(--m);font-size:16px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center}
.set-check.checked{background:var(--a);border-color:var(--a);color:#000}
.set-check:active{transform:scale(.92)}
.set-row.set-done .set-input{color:var(--a)}

.set-col{text-align:center;font-size:9px}

/* Workout footer */
.workout-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:50}
.finish-btn{width:100%;background:var(--card);border:1px solid var(--b);border-radius:12px;color:var(--m);font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:14px;cursor:pointer;transition:all .2s;letter-spacing:.02em}
.finish-btn.ready{background:var(--a);color:#000;border-color:var(--a);box-shadow:0 0 24px rgba(0,255,0,.4)}
.finish-btn.ready:active{transform:scale(.98)}

/* Rest timer overlay */
.rest-overlay{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;background:linear-gradient(135deg,#1A1A1A,#0F0F0F);border:1px solid var(--a);border-radius:14px;padding:14px 16px;z-index:60;box-shadow:0 8px 24px rgba(0,255,0,.2),0 0 0 1px rgba(0,255,0,.3);overflow:hidden}
.rest-timer-content{display:flex;align-items:center;gap:14px}
.rt-info{flex:1}
.rt-label{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.rt-time{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--a);line-height:1;letter-spacing:.04em}
.rt-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rt-btn{background:var(--bg);border:1px solid var(--b);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:7px 10px;cursor:pointer}
.rt-btn:active{transform:scale(.94)}
.rt-skip{background:var(--a);color:#000;border-color:var(--a)}
.rt-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--b);overflow:hidden}
.rt-progress-bar{height:100%;background:var(--a);transition:width 1s linear}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Inicializando...</div>
  </div>
</div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- App scripts (ordem importa!) -->
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="workout.js"></script>
<script src="app.js"></script>
</body>
</html>
