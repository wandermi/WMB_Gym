<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WMB GYM">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>WMB GYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0D0D0D;font-family:'DM Sans',sans-serif;color:#F0F0F0;overscroll-behavior:none}
#app{max-width:440px;margin:0 auto;min-height:100vh}
:root{--a:#FF3D00;--done:#00E676;--card:#1E1E1E;--b:#2A2A2A;--m:#666}

/* ── HOME ── */
.hd{padding:max(env(safe-area-inset-top),36px) 22px 16px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:flex-start}
.hd h1{font-family:'Bebas Neue',sans-serif;font-size:50px;line-height:1}
.hd-sub{font-size:11px;color:var(--m);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.hd-r{display:flex;gap:7px;flex-shrink:0;margin-top:4px}
.icon-btn{background:var(--card);border:1px solid var(--b);border-radius:8px;color:var(--m);font-size:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.icon-btn:active{opacity:.7}

/* profile card */
.profile-card{margin:12px 14px 0;background:var(--card);border:1px solid var(--b);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pc-avatar{width:40px;height:40px;border-radius:50%;background:#FF3D0022;border:2px solid #FF3D0044;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pc-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em;line-height:1}
.pc-meta{font-size:11px;color:var(--m);margin-top:2px}
.pc-badge{margin-left:auto;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0}

/* schedule */
.sch-wrap{padding:12px 16px 4px}
.sch-lbl{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}
.sch-row{display:flex;gap:4px}
.sch-i{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.sch-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--b);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--m)}
.sch-day{font-size:8px;color:#444}
.day-list{padding:12px 14px 90px;display:flex;flex-direction:column;gap:9px}
.day-card{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer}
.day-card:active{transform:scale(.98)}
.di{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.d-lbl{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:.06em;line-height:1}
.d-sub{font-size:12px;color:var(--m);margin-top:2px}
.d-meta{font-size:11px;color:#444;margin-top:1px}

/* ── WORKOUT ── */
.wh{padding:16px 16px 12px;position:sticky;top:0;background:#0D0D0D;border-bottom:1px solid var(--b);z-index:10}
.wh-top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.bk{background:var(--card);border:1px solid var(--b);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#F0F0F0;font-size:16px;flex-shrink:0}
.wh-l{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;line-height:1}
.wh-s{font-size:11px;color:var(--m);margin-top:1px}
.cb{background:#0043881A;border:1px solid #00438818;border-radius:6px;font-size:10px;color:#4A9EFF;padding:3px 7px;white-space:nowrap;flex-shrink:0;margin-left:auto}
.pb{height:3px;background:var(--b);border-radius:2px;overflow:hidden}
.pb-f{height:100%;border-radius:2px;transition:width .4s}
.pb-l{font-size:11px;color:var(--m);margin-top:5px;display:flex;justify-content:space-between}
.ex-list{padding:10px 12px 110px;display:flex;flex-direction:column;gap:10px}
.ex-card{background:var(--card);border:1px solid var(--b);border-radius:12px;overflow:hidden}
.ex-card.xdone{border-color:#00E67633}
.ex-head{padding:12px 13px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:7px}
.ex-nm{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.03em;line-height:1.1;flex:1}
.ib{background:transparent;border:1px solid var(--b);border-radius:6px;color:var(--m);font-size:11px;padding:4px 8px;cursor:pointer;flex-shrink:0}
.ex-rp{font-size:11px;color:var(--m);padding:3px 13px 0}
.ex-tip{font-size:11px;color:#555;padding:2px 13px 0;font-style:italic}
.wr{padding:7px 13px 0;display:flex;align-items:center;gap:8px}
.lw{font-size:11px;color:var(--m)}
.lw b{color:#aaa;font-weight:600}
.wi-wrap{display:flex;align-items:center;gap:5px;margin-left:auto}
.wi{background:var(--b);border:1px solid #333;border-radius:6px;color:#F0F0F0;font-size:13px;font-weight:600;width:70px;padding:5px 7px;text-align:center;-webkit-appearance:none;appearance:none}
.wi:focus{outline:none;border-color:var(--a)}
.wu{font-size:11px;color:var(--m)}
.sets-row{padding:8px 13px 12px;display:flex;gap:7px;flex-wrap:wrap}
.sb{width:44px;height:44px;border-radius:8px;border:2px solid var(--b);background:transparent;color:var(--m);font-family:'Bebas Neue',sans-serif;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sb.done{border-color:var(--done);background:#00E67618;color:var(--done)}
.sb:active{transform:scale(.92)}
.fin-btn{display:block;width:100%;margin-top:6px;background:var(--a);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;padding:14px;cursor:pointer}

/* ── REST OVERLAY ── */
.ro{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#161616;border-top:2px solid var(--a);padding:13px 20px;padding-bottom:max(13px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:13px;z-index:50}
.ro-lbl{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}
.ro-t{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--a);line-height:1}
.rring{position:relative;width:56px;height:56px;flex-shrink:0}
.skip{margin-left:auto;background:var(--b);border:none;border-radius:8px;color:var(--m);font-size:12px;font-weight:500;padding:8px 13px;cursor:pointer}

/* ── MODALS ── */
.mo{position:fixed;inset:0;background:#000c;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.ms{background:#1A1A1A;border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:20px 18px;padding-bottom:max(36px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.mh{width:38px;height:4px;background:var(--b);border-radius:2px;margin:0 auto 16px}
.mt{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:.03em;line-height:1.1;margin-bottom:10px}
.mtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.mtag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px}
.sec-tag{background:#2A2A2A;color:#666;border:1px solid #333}
.slbl{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.stps{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.stp{display:flex;gap:10px;align-items:flex-start}
.stp-n{width:22px;height:22px;border-radius:50%;background:var(--a);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.stp-t{font-size:13px;line-height:1.5;color:#ccc}
.whl{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.whr{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#141414;border-radius:8px}
.whd{font-size:11px;color:var(--m)}
.whv{font-family:'Bebas Neue',sans-serif;font-size:18px}
.whdiff{font-size:11px;margin-left:5px}
.up{color:var(--done)}.dn{color:#FF6B6B}
.yt-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:#CC0000;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;padding:12px;cursor:pointer;margin-bottom:9px;text-decoration:none}
.cl-btn{display:flex;align-items:center;justify-content:center;width:100%;background:var(--b);border:none;border-radius:10px;color:var(--m);font-size:13px;font-weight:500;padding:12px;cursor:pointer}

/* ── SETTINGS MODAL ── */
.tabs{display:flex;gap:0;border:1px solid var(--b);border-radius:10px;overflow:hidden;margin-bottom:18px}
.tab{flex:1;background:transparent;border:none;color:var(--m);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:10px;cursor:pointer;transition:all .15s}
.tab.active{background:#FF3D0022;color:#FF3D00;font-weight:600}
.form-field{margin-bottom:14px}
.form-label{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px;display:block}
.form-input{width:100%;background:var(--b);border:1px solid #333;border-radius:8px;color:#F0F0F0;font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 12px;-webkit-appearance:none;appearance:none}
.form-input:focus{outline:none;border-color:var(--a)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio-group{display:flex;gap:7px;flex-wrap:wrap}
.radio-btn{background:transparent;border:1px solid var(--b);border-radius:8px;color:var(--m);font-size:12px;font-weight:500;padding:8px 12px;cursor:pointer;transition:all .15s;flex:1;text-align:center}
.radio-btn.sel{border-color:var(--a);background:#FF3D0018;color:#FF3D00}
.save-btn{width:100%;background:var(--a);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;padding:13px;cursor:pointer;margin-top:4px}
.sch-config-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #222}
.sch-config-day{font-size:12px;color:var(--m);width:30px;flex-shrink:0}
.sch-config-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.sch-select{flex:1;background:#161616;border:1px solid #333;border-radius:8px;color:#F0F0F0;font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;cursor:pointer;-webkit-appearance:none;appearance:none}
.sch-select:focus{outline:none;border-color:var(--a)}

/* ── DONE ── */
.done-sc{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:13px}
.done-em{font-size:64px;line-height:1}
.done-ti{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1}
.done-sub{font-size:13px;color:var(--m);max-width:240px}
.st-row{display:flex;gap:22px;margin-top:4px}
.st{text-align:center}
.st-v{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--done)}
.st-l{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
.btn-p{background:var(--a);border:none;border-radius:10px;color:#fff;font-weight:600;font-size:14px;padding:12px 26px;cursor:pointer}

/* ── HISTORY ── */
.hst-hd{padding:max(env(safe-area-inset-top),36px) 20px 16px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:11px}
.hst-hd h2{font-family:'Bebas Neue',sans-serif;font-size:32px;flex:1}
.hst-list{padding:12px 12px 60px;display:flex;flex-direction:column;gap:9px}
.hst-sum{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px 16px;display:flex;gap:16px}
.hsn{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--a);line-height:1}
.hsl{font-family:'Bebas Neue',sans-serif;font-size:13px;line-height:1.1}
.hss{font-size:11px;color:#444;margin-top:2px}
.hst-card{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:13px 15px}
.hc-top{display:flex;justify-content:space-between;align-items:center}
.hc-dt{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
.hc-nm{font-family:'Bebas Neue',sans-serif;font-size:17px;margin-top:2px}
.hc-sb{font-size:11px;color:#555;margin-top:1px}
.hc-st{display:flex;gap:13px;margin-top:6px}
.hc-s{font-size:12px;color:var(--m)}
.hc-s b{color:#F0F0F0;font-weight:600}
.no-hist{text-align:center;padding:50px 22px;color:var(--m);font-size:13px}

textarea.form-input{resize:none;height:72px}
select.form-input option{background:#1A1A1A}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MC={"Peito":"#FF6B6B","Tríceps":"#FFA07A","Ombros":"#FFD700","Costas":"#4ECDC4","Bíceps":"#45B7D1","Antebraço":"#74B9FF","Quadríceps":"#A29BFE","Isquiotibiais":"#DDA0DD","Glúteos":"#F0A500","Panturrilha":"#81ECEC","Core":"#55EFC4"};
const GOAL_COLORS={"Massa":"#FF8F00","Emagrecimento":"#00BCD4","Ambos":"#00E676"};
const LEVEL_ICONS={"Iniciante":"🌱","Intermediário":"💪","Avançado":"🔥"};
const DAYS_NAMES=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DEFAULT_SCH=["T1","T2","T3","DESCANSO","T4","T5","T6"];

const W=[
{id:"T1",label:"Treino 1",sub:"Push A — Peito · Ombros · Tríceps",color:"#FF3D00",icon:"🔴",exercises:[
{name:"Supino Reto c/ Barra",sets:4,reps:"8–10",rest:90,tip:"Desça até tocar o peito, subida explosiva",muscles:{p:["Peito"],s:["Tríceps","Ombros"]},steps:["Deite no banco, barra na linha do peito. Pegada levemente mais larga que os ombros.","Desça de forma controlada até tocar levemente o peito — não quique.","Empurre explosivamente sem travar os cotovelos no topo."],yt:"supino reto barra como fazer academia"},
{name:"Supino Inclinado c/ Halteres",sets:3,reps:"10–12",rest:75,tip:"Banco 30–45°, cotovelos levemente fechados",muscles:{p:["Peito"],s:["Tríceps","Ombros"]},steps:["Banco inclinado a 30–45°. Halteres na altura do peito superior.","Desça os halteres controlado até sentir o peito superior alongar.","Pressione para cima e levemente para dentro."],yt:"supino inclinado haltere como fazer"},
{name:"Crucifixo c/ Halteres",sets:3,reps:"12–15",rest:60,tip:"Leve flexão no cotovelo, sinta o alongamento",muscles:{p:["Peito"],s:["Ombros"]},steps:["Deite no banco plano, halteres acima do peito, cotovelos levemente dobrados.","Abra os braços em arco até sentir o peito alongar bem.","Feche os braços como se abraçasse uma árvore grande."],yt:"crucifixo haltere banco como fazer"},
{name:"Desenvolvimento Militar c/ Barra",sets:4,reps:"8–10",rest:90,tip:"Core firme, sem hiperestender a lombar",muscles:{p:["Ombros"],s:["Tríceps"]},steps:["Sentado, barra na frente na altura do peito, pegada na largura dos ombros.","Empurre a barra para cima até os braços estenderem acima da cabeça.","Desça de forma controlada até a altura do queixo."],yt:"desenvolvimento militar barra como fazer ombros"},
{name:"Elevação Lateral c/ Haltere",sets:4,reps:"12–15",rest:60,tip:"Cotovelo levemente dobrado, sem balançar o tronco",muscles:{p:["Ombros"],s:[]},steps:["Em pé, halteres ao lado do corpo.","Levante os braços para os lados até ficarem paralelos ao chão.","Desça de forma controlada. Nada de balanço."],yt:"elevação lateral haltere ombros como fazer"},
{name:"Tríceps Pulley — corda",sets:4,reps:"10–12",rest:60,tip:"Abra a corda no final, cotovelos fixos ao corpo",muscles:{p:["Tríceps"],s:[]},steps:["Polia alta. Cotovelos colados ao corpo segurando a corda.","Empurre para baixo até os braços estenderem. Abra as pontas.","Volte controlado — só os antebraços se movem."],yt:"triceps pulley corda como fazer"},
]},
{id:"T2",label:"Treino 2",sub:"Pull A — Costas · Bíceps",color:"#FF8F00",icon:"🟠",exercises:[
{name:"Puxada Frontal — pegada larga",sets:4,reps:"8–10",rest:90,tip:"Cotovelos apontam para baixo, puxe até o peito",muscles:{p:["Costas"],s:["Bíceps"]},steps:["Polia alta, pegada mais larga que os ombros, palmas para frente.","Puxe a barra até o peito, inclinando levemente o tronco.","Retorne controlado, braços estendendo completamente."],yt:"puxada frontal pegada larga como fazer"},
{name:"Remada Curvada c/ Barra",sets:4,reps:"8–10",rest:90,tip:"Tronco ~45°, puxe até o umbigo",muscles:{p:["Costas"],s:["Bíceps","Ombros"]},steps:["Incline o tronco a ~45°, joelhos levemente dobrados.","Puxe a barra até o umbigo, apertando as escápulas.","Desça controlado mantendo o tronco firme."],yt:"remada curvada barra como fazer"},
{name:"Remada Unilateral c/ Haltere",sets:3,reps:"10–12",rest:75,tip:"Rotação leve do tronco no final",muscles:{p:["Costas"],s:["Bíceps"]},steps:["Apoie joelho e mão do mesmo lado no banco. Halter na outra mão.","Puxe o halter em direção ao quadril, cotovelo próximo ao corpo.","Desça completamente, sentindo o alongamento da costas."],yt:"remada unilateral haltere como fazer"},
{name:"Pull-over c/ Haltere",sets:3,reps:"12–15",rest:60,tip:"Sinta o latíssimo alongar completamente",muscles:{p:["Costas"],s:["Peito"]},steps:["Deite transversalmente no banco, ombros apoiados. Halter com as duas mãos.","Desça o halter para trás da cabeça em arco, cotovelos levemente dobrados.","Retorne contraindo costas e peito."],yt:"pullover haltere banco como fazer"},
{name:"Rosca Direta c/ Barra EZ",sets:4,reps:"8–10",rest:60,tip:"Cotovelos fixos, sem balançar o tronco",muscles:{p:["Bíceps"],s:["Antebraço"]},steps:["Em pé, barra EZ com pegada supinada. Cotovelos colados ao corpo.","Dobre os cotovelos levantando a barra até próximo dos ombros.","Desça de forma controlada, sem soltar bruscamente."],yt:"rosca direta barra EZ como fazer"},
{name:"Rosca Martelo c/ Haltere",sets:3,reps:"10–12",rest:60,tip:"Palmas para dentro durante todo o movimento",muscles:{p:["Bíceps"],s:["Antebraço"]},steps:["Em pé, halteres ao lado com palmas para o corpo.","Levante um halter de cada vez sem rodar o punho.","Desça controlado antes de subir o outro lado."],yt:"rosca martelo haltere como fazer biceps"},
]},
{id:"T3",label:"Treino 3",sub:"Legs A — Quadríceps · Glúteos",color:"#FFD600",icon:"🟡",exercises:[
{name:"Hack Squat na Máquina",sets:4,reps:"8–10",rest:120,tip:"Costas na plataforma, amplitude total",muscles:{p:["Quadríceps","Glúteos"],s:["Isquiotibiais"]},steps:["Apoie costas e ombros na plataforma. Pés na largura dos ombros, levemente abertos.","Desça até as coxas ficarem paralelas ou abaixo.","Empurre para cima sem travar os joelhos."],yt:"hack squat máquina como usar correto"},
{name:"Leg Press 45°",sets:4,reps:"10–12",rest:90,tip:"Não trave os joelhos, não levante o quadril",muscles:{p:["Quadríceps","Glúteos"],s:["Isquiotibiais"]},steps:["Pés na plataforma na largura dos ombros. Solte o trava.","Desça até os joelhos chegarem a ~90°.","Empurre sem bloquear completamente os joelhos."],yt:"leg press 45 como fazer correto"},
{name:"Cadeira Extensora",sets:3,reps:"12–15",rest:60,tip:"Pause 1s no topo — máximo pico de contração",muscles:{p:["Quadríceps"],s:[]},steps:["Ajuste para o joelho alinhar ao eixo. Pés sob o rolo.","Estenda as pernas completamente para cima.","Segure 1s no topo, desça lentamente até ~90°."],yt:"cadeira extensora como usar quadríceps"},
{name:"Mesa Flexora Deitada",sets:3,reps:"12–15",rest:60,tip:"Descida lenta 3s — isso constrói mais do que a subida",muscles:{p:["Isquiotibiais"],s:["Panturrilha"]},steps:["Deite no aparelho, joelhos alinhados ao eixo, rolo sob os tornozelos.","Dobre os joelhos puxando em direção ao glúteo.","Desça muito lentamente — conte 3 segundos."],yt:"mesa flexora isquiotibial como usar"},
{name:"Stiff c/ Halteres",sets:3,reps:"10–12",rest:75,tip:"Costas retas — a lombar não faz o trabalho",muscles:{p:["Isquiotibiais","Glúteos"],s:["Costas"]},steps:["Em pé, halteres na frente das coxas, joelhos levemente dobrados.","Incline o tronco para frente com as costas retas, descendo os halteres.","Suba usando glúteo e posterior da coxa."],yt:"stiff haltere como fazer isquiotibial"},

// ── STORAGE ───────────────────────────────────────────────────
const wKey=n=>"wmb:w:"+n.replace(/\W+/g,"_").slice(0,28);
const store={
  get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};
const saveWeight=(n,w)=>{if(!w||isNaN(+w))return;const k=wKey(n);let h=store.get(k)||[];const td=new Date().toDateString();h=h.filter(x=>new Date(x.ts).toDateString()!==td);h.unshift({ts:Date.now(),w:+w});if(h.length>30)h=h.slice(0,30);store.set(k,h);};
const getWeight=n=>store.get(wKey(n))||[];
const saveHist=e=>{let h=store.get("wmb:hist")||[];h.unshift(e);if(h.length>60)h=h.slice(0,60);store.set("wmb:hist",h);};
const getHist=()=>store.get("wmb:hist")||[];
const getProfile=()=>store.get("wmb:profile")||null;
const saveProfile=p=>store.set("wmb:profile",p);
const getSch=()=>store.get("wmb:sch")||["T1","T2","T3","DESCANSO","T4","T5","T6"];
const saveSch=s=>store.set("wmb:sch",s);

// ── STATE ─────────────────────────────────────────────────────
let S={view:"home",selIdx:null,compSets:{},wInputs:{},lastW:{},timer:{on:false,secs:0,total:0},modal:null,modalWH:[],t0:0,settingsTab:"perfil"};
let timerInt=null;
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const fmtD=ts=>new Date(ts).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const fmtDL=ts=>new Date(ts).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});

function syncInputs(){document.querySelectorAll(".wi").forEach(el=>{S.wInputs[el.dataset.i]=el.value;});}

function render(){
  document.getElementById("app").innerHTML=
    S.view==="home"?vHome():
    S.view==="workout"?vWorkout():
    S.view==="history"?vHistory():
    S.view==="done"?vDone():"";
  if(S.modal)document.getElementById("app").insertAdjacentHTML("beforeend",vModal());
  if(S.view==="settings")document.getElementById("app").innerHTML=vSettings();
  if(S.timer.on){ensureRestOverlay();renderTimer();}
}

function vHome(){
  const sch=getSch();
  const prof=getProfile();
  const schDots=sch.map((id,i)=>{
    if(id==="DESCANSO")return`<div class="sch-i"><div class="sch-dot" style="font-size:8px;color:#333">ZZZ</div><div class="sch-day">${DAYS_NAMES[i]}</div></div>`;
    const wo=W.find(x=>x.id===id);if(!wo)return"";
    return`<div class="sch-i"><div class="sch-dot" style="border-color:${wo.color}66;color:${wo.color};font-size:9px">${id}</div><div class="sch-day" style="color:#555">${DAYS_NAMES[i]}</div></div>`;
  }).join("");
  const wIds=[...new Set(sch.filter(x=>x!=="DESCANSO"))];
  const cards=wIds.map(id=>{
    const w=W.find(x=>x.id===id);if(!w)return"";
    const i=W.indexOf(w);
    return`<div class="day-card" data-act="start" data-i="${i}"><div class="di" style="background:${w.color}22">${w.icon}</div><div style="flex:1"><div class="d-lbl">${w.label}</div><div class="d-sub">${w.sub}</div><div class="d-meta">${w.exercises.length} exercícios · ${w.exercises.reduce((a,e)=>a+e.sets,0)} séries · +20min cardio</div></div><div style="color:#666;font-size:20px">›</div></div>`;
  }).join("");
  const profCard=prof?`<div class="profile-card" data-act="settings"><div class="pc-avatar">💪</div><div style="flex:1"><div class="pc-name">${prof.name||"Aluno"}</div><div class="pc-meta">${[prof.age?prof.age+"anos":"",prof.weight?prof.weight+"kg":"",prof.height?prof.height+"cm":""].filter(Boolean).join(" · ")||"Toque para editar"}</div></div>${prof.goal?`<div class="pc-badge" style="background:${GOAL_COLORS[prof.goal]||"#666"}22;color:${GOAL_COLORS[prof.goal]||"#666"};border:1px solid ${GOAL_COLORS[prof.goal]||"#666"}33">${prof.goal}</div>`:""}</div>`:`<div class="profile-card" data-act="settings" style="border-style:dashed;border-color:#333"><div class="pc-avatar" style="background:#1E1E1E;border-color:#333">👤</div><div><div class="d-sub" style="color:#555">Nenhum perfil configurado</div><div class="d-meta">Toque para criar sua ficha</div></div><div style="color:#555;font-size:20px;margin-left:auto">›</div></div>`;
  return`<div class="hd"><div><h1>WMB<br>GYM</h1><div class="hd-sub">Massa · Emagrecimento</div></div><div class="hd-r"><button class="icon-btn" data-act="history">📊</button><button class="icon-btn" data-act="settings">⚙️</button></div></div>${profCard}<div class="sch-wrap"><div class="sch-lbl">Rotação semanal</div><div class="sch-row">${schDots}</div></div><div class="day-list">${cards}</div>`;
}

function vWorkout(){
  const wo=W[S.selIdx];
  const done=Object.values(S.compSets).flat().filter(Boolean).length;
  const total=Object.values(S.compSets).flat().length;
  const pct=total>0?done/total*100:0;
  const cards=wo.exercises.map((ex,i)=>{
    const sets=S.compSets[i]||[],xdone=sets.every(Boolean);
    const lw=S.lastW[ex.name]||[],lastVal=lw[0]?.w,curW=S.wInputs[i]||"";
    const trend=lastVal&&curW&&+curW!==lastVal?(+curW>lastVal?"↑":"↓"):"";
    const trendColor=trend==="↑"?"#00E676":"#FF6B6B";
    return`<div class="ex-card${xdone?" xdone":""}"><div class="ex-head"><div class="ex-nm">${ex.name}</div><button class="ib" data-act="modal" data-i="${i}">ℹ️ Ver</button></div><div class="ex-rp">${ex.sets} séries · ${ex.reps} reps · descanso ${fmt(ex.rest)}</div><div class="ex-tip">💡 ${ex.tip}</div><div class="wr"><div class="lw">${lastVal?`Última: <b>${lastVal}kg</b>`:`<span style="color:#444">Primeira vez</span>`}</div><div class="wi-wrap">${trend?`<span style="font-size:11px;color:${trendColor}">${trend}</span>`:""}<input class="wi" type="number" inputmode="decimal" placeholder="kg" value="${curW}" data-i="${i}"><span class="wu">kg</span></div></div><div class="sets-row">${sets.map((d,si)=>`<button class="sb${d?" done":""}" data-act="set" data-ei="${i}" data-si="${si}">${d?"✓":si+1}</button>`).join("")}</div></div>`;
  }).join("");
  const fin=pct>=100?`<button class="fin-btn" data-act="finish">Finalizar treino 🏁</button>`:"";
  const ro=S.timer.on?`<div class="ro" id="rest-overlay"></div>`:"";
  return`<div class="wh"><div class="wh-top"><button class="bk" data-act="back">‹</button><div style="flex:1"><div class="wh-l">${wo.label}</div><div class="wh-s">${wo.sub}</div></div><div class="cb">🏃 +20min</div></div><div class="pb"><div class="pb-f" style="width:${pct}%;background:${wo.color}"></div></div><div class="pb-l"><span>Progresso</span><span style="color:${wo.color}">${done}/${total} séries</span></div></div><div class="ex-list">${cards}${fin}</div>${ro}`;
}

function vModal(){
  const ex=S.modal;
  const pTags=ex.muscles.p.map(m=>`<span class="mtag" style="background:${MC[m]}33;color:${MC[m]};border:1px solid ${MC[m]}55">${m}</span>`).join("");
  const sTags=ex.muscles.s.map(m=>`<span class="mtag sec-tag">${m}</span>`).join("");
  const steps=ex.steps.map((s,i)=>`<div class="stp"><div class="stp-n">${i+1}</div><div class="stp-t">${s}</div></div>`).join("");
  const wh=S.modalWH.slice(0,6);
  const whRows=wh.length?`<div class="slbl">Histórico de carga</div><div class="whl">${wh.map((h,i)=>{const prev=wh[i+1]?.w,diff=prev!=null?+(h.w-prev).toFixed(1):null;return`<div class="whr"><div class="whd">${fmtD(h.ts)}</div><div style="display:flex;align-items:center"><div class="whv" style="color:${i===0?"#FF3D00":"#F0F0F0"}">${h.w}kg</div>${diff!=null?`<span class="whdiff ${diff>0?"up":diff<0?"dn":""}">${diff>0?"+"+diff:diff===0?"=":diff}</span>`:""}</div></div>`;}).join("")}</div>`:"";
  return`<div class="mo" id="modal-overlay"><div class="ms"><div class="mh"></div><div class="mt">${ex.name}</div><div class="mtags">${pTags}${sTags}</div><div class="slbl">Como fazer</div><div class="stps">${steps}</div>${whRows}<a class="yt-btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.yt)}" target="_blank" rel="noopener">▶ Buscar no YouTube</a><button class="cl-btn" data-act="closemodal">Fechar</button></div></div>`;
}

function vDone(){
  const wo=W[S.selIdx],done=Object.values(S.compSets).flat().filter(Boolean).length;
  const prof=getProfile();
  return`<div class="done-sc"><div class="done-em">🏆</div><div class="done-ti">TREINO<br>CONCLUÍDO</div>${prof?.name?`<div style="font-size:14px;color:#666">Parabéns, <b style="color:#F0F0F0">${prof.name}</b>!</div>`:""}<div class="st-row"><div class="st"><div class="st-v">${done}</div><div class="st-l">Séries</div></div><div class="st"><div class="st-v">${wo.exercises.length}</div><div class="st-l">Exercícios</div></div></div><p class="done-sub">Cargas salvas. Não esqueça os 20min de esteira!</p><button class="btn-p" data-act="home">← Voltar</button></div>`;
}

// ── EVENTS ────────────────────────────────────────────────────
document.addEventListener("click",e=>{
  // radio buttons
  const radio=e.target.closest("[data-radio]");
  if(radio){
    const grp=radio.dataset.radio,val=radio.dataset.val;
    document.querySelectorAll(`[data-radio="${grp}"]`).forEach(b=>b.classList.remove("sel"));
    radio.classList.add("sel");
    return;
  }
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act;

  if(act==="start"){
    syncInputs();const idx=+el.dataset.i;
    const init={},wi={},lw={};
    W[idx].exercises.forEach((ex,i)=>{init[i]=Array(ex.sets).fill(false);const h=getWeight(ex.name);lw[ex.name]=h;if(h[0])wi[i]=String(h[0].w);});
    S={...S,view:"workout",selIdx:idx,compSets:init,wInputs:wi,lastW:lw,t0:Date.now(),timer:{on:false,secs:0,total:0}};render();
  } else if(act==="back"){
    if(S.view==="workout")syncInputs();
    stopTimer();S={...S,view:"home",modal:null};render();
  } else if(act==="home"){
    stopTimer();S={...S,view:"home",selIdx:null,modal:null};render();
  } else if(act==="history"){
    S={...S,view:"history"};render();
  } else if(act==="settings"){
    S={...S,view:"settings",settingsTab:"perfil"};render();
  } else if(act==="stab"){
    S.settingsTab=el.dataset.tab;render();
  } else if(act==="saveprofile"){
    const p={
      name:document.getElementById("f-name")?.value?.trim()||"",
      age:document.getElementById("f-age")?.value||"",
      weight:document.getElementById("f-weight")?.value||"",
      height:document.getElementById("f-height")?.value||"",
      goal:document.querySelector("[data-radio='goal'].sel")?.dataset.val||"",
      level:document.querySelector("[data-radio='level'].sel")?.dataset.val||"",
      notes:document.getElementById("f-notes")?.value?.trim()||"",
    };
    saveProfile(p);
    const btn=document.querySelector("[data-act='saveprofile']");
    if(btn){btn.textContent="✓ Salvo!";btn.style.background="#00E676";setTimeout(()=>{btn.textContent="Salvar Perfil";btn.style.background="";},1500);}
  } else if(act==="savesched"){
    const sels=document.querySelectorAll(".sch-select");
    const sch=Array.from(sels).map(s=>s.value);
    saveSch(sch);
    const btn=document.querySelector("[data-act='savesched']");
    if(btn){btn.textContent="✓ Salvo!";btn.style.background="#00E676";setTimeout(()=>{btn.textContent="Salvar Rotação";btn.style.background="";},1500);}
  } else if(act==="set"){
    syncInputs();const ei=+el.dataset.ei,si=+el.dataset.si,was=S.compSets[ei][si];
    const ns={...S.compSets,[ei]:[...S.compSets[ei]]};ns[ei][si]=!was;S.compSets=ns;
    if(!was){startTimer(W[S.selIdx].exercises[ei].rest);}
    render();if(S.timer.on)renderTimer();
  } else if(act==="skip"){
    stopTimer();S.timer={on:false,secs:0,total:0};const ro=document.getElementById("rest-overlay");if(ro)ro.remove();
  } else if(act==="modal"){
    syncInputs();const i=+el.dataset.i,ex=W[S.selIdx].exercises[i];
    S.modal=ex;S.modalWH=getWeight(ex.name);
    const old=document.getElementById("modal-overlay");if(old)old.remove();
    document.getElementById("app").insertAdjacentHTML("beforeend",vModal());
  } else if(act==="closemodal"){
    S.modal=null;const mo=document.getElementById("modal-overlay");if(mo)mo.remove();
  } else if(act==="finish"){
    syncInputs();
    W[S.selIdx].exercises.forEach((ex,i)=>{const w=S.wInputs[i];if(w&&!isNaN(+w))saveWeight(ex.name,+w);});
    const dur=Math.round((Date.now()-S.t0)/60000)||1,wo=W[S.selIdx];
    const done=Object.values(S.compSets).flat().filter(Boolean).length;
    saveHist({ts:Date.now(),label:wo.label,sub:wo.sub,sets:done,totalSets:Object.values(S.compSets).flat().length,exs:wo.exercises.length,dur});
    stopTimer();S={...S,view:"done"};render();
  }
});

document.addEventListener("click",e=>{if(e.target.id==="modal-overlay"){S.modal=null;document.getElementById("modal-overlay")?.remove();}});
document.addEventListener("input",e=>{if(e.target.classList.contains("wi"))S.wInputs[e.target.dataset.i]=e.target.value;});

// ── TIMER ─────────────────────────────────────────────────────
function ensureRestOverlay(){
  if(!document.getElementById("rest-overlay"))
    document.getElementById("app").insertAdjacentHTML("beforeend",`<div class="ro" id="rest-overlay"></div>`);
}
function renderTimer(){
  const ro=document.getElementById("rest-overlay");if(!ro)return;
  const {secs,total}=S.timer,rR=24,rC=2*Math.PI*rR,dash=total>0?rC*(secs/total):0;
  const ac=S.selIdx!==null?W[S.selIdx].color:"#FF3D00";
  ro.innerHTML=`<div class="rring"><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="${rR}" fill="none" stroke="#2A2A2A" stroke-width="4"/><circle cx="28" cy="28" r="${rR}" fill="none" stroke="${ac}" stroke-width="4" stroke-dasharray="${rC.toFixed(2)}" stroke-dashoffset="${(rC-dash).toFixed(2)}" stroke-linecap="round" transform="rotate(-90 28 28)"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;color:${ac}">${secs}</div></div><div><div class="ro-lbl">Descanso</div><div class="ro-t">${fmt(secs)}</div></div><button class="skip" data-act="skip">Pular</button>`;
}
function startTimer(secs){
  stopTimer();S.timer={on:true,secs,total:secs};
  timerInt=setInterval(()=>{
    S.timer.secs--;
    if(S.timer.secs<=0){stopTimer();S.timer={on:false,secs:0,total:0};document.getElementById("rest-overlay")?.remove();return;}
    if(!document.getElementById("rest-overlay")){clearInterval(timerInt);return;}
    renderTimer();
  },1000);
}
function stopTimer(){clearInterval(timerInt);timerInt=null;}

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
