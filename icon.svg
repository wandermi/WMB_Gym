<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background com gradiente sutil -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F0F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00CC00;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Glow effect atrás -->
  <circle cx="256" cy="256" r="180" fill="#00FF00" opacity="0.08" filter="url(#glow)"/>
  
  <!-- Halter horizontal estilizado -->
  <g transform="translate(256, 256)">
    <!-- Barra central -->
    <rect x="-100" y="-12" width="200" height="24" rx="12" fill="url(#green)"/>
    
    <!-- Peso esquerdo -->
    <rect x="-150" y="-50" width="30" height="100" rx="8" fill="#00FF00"/>
    <rect x="-130" y="-65" width="22" height="130" rx="6" fill="#00CC00"/>
    
    <!-- Peso direito -->
    <rect x="120" y="-50" width="30" height="100" rx="8" fill="#00FF00"/>
    <rect x="108" y="-65" width="22" height="130" rx="6" fill="#00CC00"/>
  </g>
  
  <!-- Texto WMB -->
  <text x="256" y="430" 
        text-anchor="middle" 
        font-family="Impact, 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="80" 
        fill="#00FF00"
        letter-spacing="6"
        filter="url(#glow)">WMB</text>
</svg>
